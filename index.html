<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Master's Thesis - 3D Book</title>
  <link rel="icon" type="image/svg+xml" href="logo_UniGe_WHITE.svg">
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

  <!-- Floating glass island with branding and book controls. -->
  <header class="glass-bar">
    <div class="brand">
      <img src="logo_orizzontale_WHITE.svg" alt="Universita di Genova">
    </div>

    <div class="bar-group">
      <button id="btn-prev" class="glass-btn">◀ Prec</button>
      <span id="page-counter" class="page-badge">Pagina 1 di --</span>
      <button id="btn-next" class="glass-btn">Succ ▶</button>
    </div>

    <div class="bar-group">
      <label for="page-input">Vai a pag:</label>
      <input type="number" id="page-input" min="1" value="1" class="glass-input">
      <button id="btn-go" class="glass-btn-sm">Vai</button>
    </div>

    <!-- Zoom controls: decrease, display, increase, or reset the book scale. -->
    <div class="bar-group">
      <button id="btn-zoom-out" class="glass-btn-sm" type="button" aria-label="Riduci zoom" title="Riduci zoom">-</button>
      <span id="zoom-level" class="zoom-level" aria-live="polite">100%</span>
      <button id="btn-zoom-in" class="glass-btn-sm" type="button" aria-label="Aumenta zoom" title="Aumenta zoom">+</button>
      <button id="btn-zoom-reset" class="glass-btn-sm" type="button">Reset</button>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="viewport">
    <div id="book-scaler" class="book-scaler">
      <div id="book"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
