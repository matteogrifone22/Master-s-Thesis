<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesi di Laurea - Libro 3D</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
</head>
<body>

  <!-- Controls Bar Top -->
  <header class="glass-bar">
    <div class="bar-group">
      <button id="btn-prev" class="glass-btn">◀ Prec</button>
      <span id="page-counter" class="page-badge">Pagina 1 di --</span>
      <button id="btn-next" class="glass-btn">Succ ▶</button>
    </div>

    <div class="bar-group">
      <label for="page-input">Vai a pag:</label>
      <input type="number" id="page-input" min="1" value="1" class="glass-input">
      <button id="btn-go" class="glass-btn-sm">Vai</button>
    </div>

    <div class="bar-group">
      <button id="btn-zoom-out" class="glass-btn-sm">🔍 -</button>
      <span id="zoom-level">100%</span>
      <button id="btn-zoom-in" class="glass-btn-sm">🔍 +</button>
      <button id="btn-zoom-reset" class="glass-btn-sm">Reset</button>
    </div>
  </header>

  <!-- Main Viewport -->
  <main class="viewport">
    <div id="book-container" class="book-container">
      <div id="book"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
